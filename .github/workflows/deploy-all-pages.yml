name: Deploy All Platforms to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-all-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-all:
    name: Build & Deploy All 4 Ecosystem Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Deploy Customer App
        run: |
          pnpm --filter orderking-customers run build
          npx wrangler pages deploy orderking-customers/dist --project-name=orderking-customers --branch=main --commit-dirty=true --no-bundle
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://orderkingpay.com
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'fc53b6fd613df944a3a46606cfbf21d0' }}

      - name: Build & Deploy Rider App
        run: |
          pnpm --filter orderking-riders run build
          npx wrangler pages deploy orderking-riders/dist --project-name=orderking-riders --branch=main --commit-dirty=true --no-bundle
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://rider.orderkingpay.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'fc53b6fd613df944a3a46606cfbf21d0' }}

      - name: Build & Deploy Restaurant Partner App
        run: |
          pnpm --filter orderking-partners run build
          npx wrangler pages deploy orderking-partners/dist --project-name=orderking-partners --branch=main --commit-dirty=true --no-bundle
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://partner.orderkingpay.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'fc53b6fd613df944a3a46606cfbf21d0' }}

      - name: Build & Deploy Central Admin (HDmaster)
        run: |
          pnpm --filter orderking-hdmaster run build
          npx wrangler pages deploy HDmaster/dist --project-name=orderking-hdmaster --branch=main --commit-dirty=true --no-bundle
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://admin.orderkingpay.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'fc53b6fd613df944a3a46606cfbf21d0' }}
