name: Deploy All Platforms to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-all-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-all:
    name: Build & Deploy All 4 Ecosystem Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: production
      CLOUDFLARE_ACCOUNT_ID: fc53b6fd613df944a3a46606cfbf21d0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VITE_AUTH_ENABLED: "true"
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prod=false
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: "false"

      - name: Build & Deploy Customer App
        run: |
          pnpm --filter orderking-customers run build
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler pages deploy orderking-customers/dist --project-name=orderking-customers --branch=main --commit-dirty=true
          else
            echo "Notice: CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. Cloudflare Pages git integration handles deployment directly."
          fi
        env:
          BETTER_AUTH_URL: https://orderkingpay.com

      - name: Build & Deploy Rider App
        run: |
          pnpm --filter orderking-riders run build
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler pages deploy orderking-riders/dist --project-name=orderking-riders --branch=main --commit-dirty=true
          else
            echo "Notice: CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. Cloudflare Pages git integration handles deployment directly."
          fi
        env:
          BETTER_AUTH_URL: https://rider.orderkingpay.com

      - name: Build & Deploy Restaurant Partner App
        run: |
          pnpm --filter orderking-partners run build
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler pages deploy orderking-partners/dist --project-name=orderking-partners --branch=main --commit-dirty=true
          else
            echo "Notice: CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. Cloudflare Pages git integration handles deployment directly."
          fi
        env:
          BETTER_AUTH_URL: https://partner.orderkingpay.com

      - name: Build & Deploy Central Admin (HDmaster)
        run: |
          pnpm --filter HDmaster run build
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler pages deploy HDmaster/dist --project-name=orderking-hdmaster --branch=main --commit-dirty=true
          else
            echo "Notice: CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. Cloudflare Pages git integration handles deployment directly."
          fi
        env:
          BETTER_AUTH_URL: https://admin.orderkingpay.com
