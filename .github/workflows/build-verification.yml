name: Production Build Verification
on:
  push:
    branches:
      - main
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm 12.8.1
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify all app builds
        run: |
          pnpm --filter ./HDmaster build
          pnpm --filter ./orderking-customers build
          pnpm --filter ./orderking-partners build
          pnpm --filter ./orderking-riders build
          pnpm --filter ./Apps-integration- build
