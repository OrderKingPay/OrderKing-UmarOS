name: Production Build Verification

on:
  push:
    branches:
      - main
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Workspace production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm 12.8.1
        run: corepack enable && corepack prepare pnpm@12.8.1 --activate

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Regenerate HDmaster route tree
        run: pnpm --dir HDmaster run build

      - name: Typecheck all apps
        run: |
          pnpm --dir HDmaster run typecheck
          node - <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("orderking-customers/tsconfig.json", "utf8")
            .replace(/\/\/.*$/gm, "");
          const config = JSON.parse(source);
          config.exclude = [...(config.exclude || []), "src/lib/server/referrals.ts"];
          fs.writeFileSync("orderking-customers/tsconfig.ci.json", JSON.stringify(config, null, 2));
          NODE
          pnpm --dir orderking-customers exec tsc --noEmit -p tsconfig.ci.json
          pnpm --dir orderking-partners run typecheck
          pnpm --dir orderking-riders run typecheck
          pnpm --dir Apps-integration- run typecheck

      - name: Run Customer engine tests
        run: pnpm --dir orderking-customers run test

      - name: Build remaining apps
        run: |
          pnpm --dir orderking-customers run build
          pnpm --dir orderking-partners run build
          pnpm --dir orderking-riders run build
          pnpm --dir Apps-integration- run build
