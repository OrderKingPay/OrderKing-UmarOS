name: Repair and Commit App Lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-lockfiles.yml"
      - "HDmaster/package.json"
      - "orderking-customers/package.json"
      - "orderking-partners/package.json"

permissions:
  contents: write

concurrency:
  group: repair-lockfiles-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - HDmaster
          - orderking-customers
          - orderking-partners

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 12.8.1
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Generate workspace lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit workspace lockfile when changed
        run: |
          git config user.name "orderking-lockfile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No workspace lockfile change"
          else
            git commit -m "ci: synchronize pnpm workspace lockfile"
            git push
          fi
