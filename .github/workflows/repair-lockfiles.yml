name: Repair and Commit App Lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-lockfiles.yml"
      - "HDmaster/package.json"
      - "orderking-customers/package.json"
      - "orderking-partners/package.json"

permissions:
  contents: write

concurrency:
  group: repair-lockfiles-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - HDmaster
          - orderking-customers
          - orderking-partners

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile without running lifecycle scripts
        working-directory: ${{ matrix.app }}
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          git config user.name "orderking-lockfile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.app }}/package-lock.json"
          if git diff --cached --quiet; then
            echo "No lockfile change for ${{ matrix.app }}"
          else
            git commit -m "ci: generate ${{ matrix.app }} package lockfile"
            git push
          fi
