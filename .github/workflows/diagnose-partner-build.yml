name: Diagnose OrderKing Partners Build

on:
  push:
    branches:
      - ci/diagnose-partner-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orderking-partners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 12.8.1
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: .

      - name: Build
        run: pnpm --filter ./orderking-partners build
        working-directory: .
