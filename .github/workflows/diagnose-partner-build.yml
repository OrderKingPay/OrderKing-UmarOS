name: Diagnose OrderKing Partners Build

on:
  push:
    branches:
      - ci/diagnose-partner-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orderking-partners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orderking-partners/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
