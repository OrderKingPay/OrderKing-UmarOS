name: Diagnose OrderKing Partners Build

on:
  push:
    branches:
      - ci/diagnose-partner-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orderking-partners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orderking-partners/package-lock.json

      - name: Regenerate lockfile for the pinned Vite/Rolldown matrix
        shell: bash
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile on diagnostic branch
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- orderking-partners/package-lock.json; then
            echo "Lockfile already synchronized."
          else
            git add orderking-partners/package-lock.json
            git commit -m "ci: regenerate partner lockfile for pinned Vite/Rolldown"
            git push
          fi

      - name: Verify clean install
        run: npm ci

      - name: Verify production build
        run: npm run build
