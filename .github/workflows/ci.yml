name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      # Run each workspace suite separately for reliable logs and bounded failures.
      # Turbo's aggregated command previously hung for 30 minutes without test output.
      - name: Test shared UI
        timeout-minutes: 7
        run: pnpm --filter @orderking/ui test
      - name: Test integration app
        timeout-minutes: 7
        run: pnpm --filter app-builder-workspace test
      - name: Test riders
        timeout-minutes: 7
        run: pnpm --filter orderking-riders test
      - name: Test partners
        timeout-minutes: 7
        run: pnpm --filter orderking-partners test
      - name: Test customers
        timeout-minutes: 7
        run: pnpm --filter orderking-customers test
      - name: Test admin
        timeout-minutes: 7
        run: pnpm --filter HDmaster test
      - name: Build
        run: pnpm run build
