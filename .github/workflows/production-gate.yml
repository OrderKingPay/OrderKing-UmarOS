name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify 5-App Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cloudflare-only runtime guard
        shell: bash
        run: |
          set -euo pipefail
          runtime_hits="$(git grep -n -E 'process\\.env\\.(VERCEL_URL|VERCEL_PROJECT_PRODUCTION_URL)|vercel\\.app|netlify\\.app' -- 'orderking-customers/src/**' 'orderking-partners/src/**' 'orderking-riders/src/**' 'HDmaster/src/**' 'Apps-integration-/src/**' || true)"
          if [[ -n "$runtime_hits" ]]; then
            echo "Cloudflare-only guard failed: legacy hosting references remain in runtime code."
            echo "$runtime_hits"
            exit 1
          fi
          credential_hits="$(git grep -n -E '"test_key"|"test_secret"' -- 'orderking-customers/src/**' 'orderking-partners/src/**' 'orderking-riders/src/**' 'HDmaster/src/**' 'Apps-integration-/src/**' || true)"
          if [[ -n "$credential_hits" ]]; then
            echo "Production credential guard failed: fake Razorpay credentials remain in runtime code."
            echo "$credential_hits"
            exit 1
          fi

      - name: Run Typecheck across 5 apps
        run: pnpm run typecheck

      - name: Build all 5 apps
        run: pnpm run build
