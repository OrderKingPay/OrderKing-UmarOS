name: OrderKing production gate

on:
  push:
    branches: [main]
    paths:
      - "HDmaster/**"
      - "orderking-customers/**"
      - "orderking-partners/**"
      - "orderking-riders/**"
      - "Apps-integration-/**"
      - ".github/workflows/production-gate.yml"
  pull_request:
    paths:
      - "HDmaster/**"
      - "orderking-customers/**"
      - "orderking-partners/**"
      - "orderking-riders/**"
      - "Apps-integration-/**"
      - ".github/workflows/production-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orderking-production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-five-apps:
    name: Verify ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: HDmaster
            path: HDmaster
          - app: orderking-customers
            path: orderking-customers
          - app: orderking-partners
            path: orderking-partners
          - app: orderking-riders
            path: orderking-riders
          - app: Apps-integration-
            path: Apps-integration-
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 12.8.1
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: .

      - name: Typecheck
        run: pnpm --filter "./${{ matrix.path }}" typecheck
        working-directory: .

      - name: Test
        run: pnpm --filter "./${{ matrix.path }}" test
        working-directory: .

      - name: Production build
        run: pnpm --filter "./${{ matrix.path }}" build
        working-directory: .
