name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify 5-App Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production truth gate
        run: node scripts/production-truth-gate.mjs

      - name: Run Typecheck across 5 apps
        run: pnpm run typecheck

      - name: Run lint across apps
        run: pnpm -r --if-present lint

      - name: Run auth invariant checks
        run: pnpm -r --if-present check:auth

      - name: Run app tests
        run: pnpm -r --if-present test

      - name: Build all 5 apps
        run: pnpm run build
