name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify 5-App Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            HDmaster/package-lock.json
            orderking-customers/package-lock.json
            orderking-partners/package-lock.json
            orderking-riders/package-lock.json
            Apps-integration-/package-lock.json

      - name: Install, typecheck and build all 5 apps
        shell: bash
        run: |
          set -euo pipefail
          apps=(
            "HDmaster"
            "orderking-customers"
            "orderking-partners"
            "orderking-riders"
            "Apps-integration-"
          )
          for app in "${apps[@]}"; do
            echo "===== ${app} ====="
            cd "${GITHUB_WORKSPACE}/${app}"
            npm install --legacy-peer-deps --no-package-lock
            npm run typecheck
            npm run build
          done
