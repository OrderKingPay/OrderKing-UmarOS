name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify 5-App Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Diagnose canonical lockfile
        run: |
          pnpm install --lockfile-only --ignore-scripts
          echo '--- LOCKFILE DIFF ---'
          git diff -- pnpm-lock.yaml | sed -n '1,220p'
          exit 1

      - name: Run Typecheck across 5 apps
        run: pnpm run typecheck

      - name: Build all 5 apps
        run: pnpm run build
