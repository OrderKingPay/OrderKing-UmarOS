name: ReleaseCommander

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}/orderking:${{ github.sha }}

      - name: Setup Python for Deployment Script
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Blue-Green Deployment
        env:
          NEW_IMAGE: ghcr.io/${{ github.repository }}/orderking:${{ github.sha }}
          API_URL: https://api.orderking.example.com
        run: |
          python infrastructure/deploy/blue-green.py deploy --image $NEW_IMAGE --target-traffic 10
          python infrastructure/deploy/blue-green.py monitor --duration 300 --error-threshold 0.01
          python infrastructure/deploy/blue-green.py promote
