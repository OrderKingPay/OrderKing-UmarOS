services:
  - type: web
    name: orderking-hdmaster
    runtime: docker
    plan: free
    region: singapore
    branch: cloudrun/production-bootstrap-2026-09-30
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: APP_DIR
        value: HDmaster
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

